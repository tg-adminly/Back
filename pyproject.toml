[project]
name = "tgagent"
version = "0.1.0"
description = "Telegram agentlar platformasi: rozigrish kanali agenti"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.7",
    "cryptography>=43",
    "tzdata",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "openai>=3.25.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
